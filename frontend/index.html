<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Aurea Hotel | Luxury Hotel & Rooms near Tirana</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Experience comfort at Aurea Hotel Tirana. Modern rooms, elegant design, easy online booking and a relaxing stay in Albania."
    />

    <meta
      name="keywords"
      content="hotel in Tirana, hotel Albania, booking hotel Albania, Aurea Hotel"
    />

    <meta name="author" content="Aurea Hotel" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Canonical -->
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Aurea Hotel | Hotel in Tirana" />

    <meta
      property="og:description"
      content="Book premium rooms at Aurea Hotel in  Tirana, Albania."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />

    <meta
      property="og:image"
      content="https://example.com/hotel-preview.jpg"
    />

    <meta property="og:site_name" content="Aurea Hotel" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Aurea Hotel | Hotel in  Tirana" />

    <meta
      name="twitter:description"
      content="Book premium rooms at Aurea Hotel near Tirana."
    />

    <meta
      name="twitter:image"
      content="https://example.com/hotel-preview.jpg"
    />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "Aurea Hotel",
        "url": "https://example.com/",
        "logo": "https://example.com/web-app-manifest-512x512.png",
        "image": "https://example.com/hotel-preview.jpg",
        "description": "Aurea Hotel offers premium rooms and modern accommodation in Kamëz near Tirana.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kamëz",
          "addressRegion": "Tirana",
          "addressCountry": "AL"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- React -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </body>
</html>
